services:
  - type: web
    name: api-login-products
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Variables de entorno para la base de datos (configúralas en el dashboard de Render)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Variables de entorno para email (configúralas en el dashboard de Render)
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: EMAIL_REMITENTE
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
